[package]
name = "kbolt"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
foldhash = "0.2.0"
memchr = "2.8"

[[bench]]
name = "count"
harness = false

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "parallel"
harness = false
