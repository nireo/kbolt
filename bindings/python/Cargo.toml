[package]
name = "kbolt-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_kbolt"
crate-type = ["cdylib"]

[dependencies]
kbolt = { path = "../.." }
pyo3 = { version = "0.30", features = ["abi3-py311"] }

# Work around rust-lang/rust#157750 on macOS 27+ where stripping release cdylibs
# leaves LC_SYMTAB's stroff 4-byte aligned instead of 8-byte aligned.
# On Linux/Windows CI, pass `maturin build --strip` to reduce wheel size.
[profile.release]
strip = false
debug = "line-tables-only"
